name: Sattari Audio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Product catalog
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Export generated focused matrix
        run: echo "matrix=$(tr -d '\\n' < config/ci-matrix.generated.json)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Fast, dependency-light gates. No JUCE / no submodules, so this finishes in
  # seconds and gives quick feedback on structure + cross-language consistency.
  # ---------------------------------------------------------------------------
  checks:
    name: Checks (structure + brand sync + core contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Suite structure inventory
        run: python3 scripts/suite_gate_check.py

      - name: Source layout + truth-label gate
        run: ./scripts/validate_sources.sh

      - name: Brand registry <-> Hub manifest sync
        run: python3 scripts/check_brand_registry_sync.py

      - name: Build + run pure-C++ core contracts
        run: |
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/pitch_detector_contract.cpp -o /tmp/pitch_detector_contract
          /tmp/pitch_detector_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/harmonic_core_contract.cpp -o /tmp/harmonic_core_contract
          /tmp/harmonic_core_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/key_detector_contract.cpp -o /tmp/key_detector_contract
          /tmp/key_detector_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/chromagram_contract.cpp -o /tmp/chromagram_contract
          /tmp/chromagram_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/scale_interval_contract.cpp -o /tmp/scale_interval_contract
          /tmp/scale_interval_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/kweighting_contract.cpp -o /tmp/kweighting_contract
          /tmp/kweighting_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/drum_kit_contract.cpp -o /tmp/drum_kit_contract
          /tmp/drum_kit_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/drum_pads_contract.cpp -o /tmp/drum_pads_contract
          /tmp/drum_pads_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/drum_looper_contract.cpp -o /tmp/drum_looper_contract
          /tmp/drum_looper_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/beat_grid_contract.cpp -o /tmp/beat_grid_contract
          /tmp/beat_grid_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/groove_contract.cpp -o /tmp/groove_contract
          /tmp/groove_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/slice_table_contract.cpp -o /tmp/slice_table_contract
          /tmp/slice_table_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/onset_curve_contract.cpp -o /tmp/onset_curve_contract
          /tmp/onset_curve_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra -pthread \
            core/tests/realtime_snapshot_contract.cpp -o /tmp/realtime_snapshot_contract
          /tmp/realtime_snapshot_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/psola_shifter_contract.cpp -o /tmp/psola_shifter_contract
          /tmp/psola_shifter_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/crepe_pitch_contract.cpp -o /tmp/crepe_pitch_contract
          /tmp/crepe_pitch_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/vox_analyzer_contract.cpp -o /tmp/vox_analyzer_contract
          /tmp/vox_analyzer_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/vox_synth_contract.cpp -o /tmp/vox_synth_contract
          /tmp/vox_synth_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/formant_shifter_contract.cpp -o /tmp/formant_shifter_contract
          /tmp/formant_shifter_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/vocoder_bank_contract.cpp -o /tmp/vocoder_bank_contract
          /tmp/vocoder_bank_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/harmonic_mask_contract.cpp -o /tmp/harmonic_mask_contract
          /tmp/harmonic_mask_contract

  # ---------------------------------------------------------------------------
  # Release-critical build matrix on macOS. This is deliberately a focused
  # subset; the root job below checks that all products configure together.
  # fail-fast: false so one broken plugin doesn't mask the others.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.plugin }}
    needs: catalog
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # JUCE lives in third_party/JUCE

      - name: Install build tools
        # Idempotent: the self-hosted Mac already has these, so only install if missing.
        run: command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        run: >
          cmake -S plugins/${{ matrix.plugin }}
          -B build/${{ matrix.plugin }}
          -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin (AU/VST3/Standalone)
        run: cmake --build build/${{ matrix.plugin }} --config Release -j"$(sysctl -n hw.ncpu)"

      - name: Build + run contract test
        if: ${{ matrix.test != '' }}
        run: |
          cmake --build build/${{ matrix.plugin }} --target ${{ matrix.test }} -j"$(sysctl -n hw.ncpu)"
          bin="$(find build/${{ matrix.plugin }} -type f -name '${{ matrix.test }}' -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::contract test binary ${{ matrix.test }} not found"; exit 1; fi
          echo "Running $bin"
          "$bin"

      - name: Render editor visual contract
        if: ${{ matrix.uiRender == true }}
        run: |
          bin="$(find build/${{ matrix.plugin }} -type f -name '${{ matrix.test }}' -perm +111 | head -n1)"
          image="$RUNNER_TEMP/${{ matrix.plugin }}-editor.png"
          "$bin" --render-ui "$image"
          test -s "$image"
          file "$image" | grep -q 'PNG image data'

      # Render harness in --smoke mode: proves the real audio path produces
      # finite, non-silent output. A strict null-test against the golden runs
      # locally (same machine + Rubber Band); it is intentionally NOT a CI gate
      # because Rubber Band output is not bit-portable across versions/platforms.
      - name: Build + run render smoke
        if: ${{ matrix.render != '' }}
        run: |
          cmake --build build/${{ matrix.plugin }} --target ${{ matrix.render }} -j"$(sysctl -n hw.ncpu)"
          bin="$(find build/${{ matrix.plugin }} -type f -name '${{ matrix.render }}' -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::render binary ${{ matrix.render }} not found"; exit 1; fi
          echo "Running $bin --smoke"
          "$bin" --smoke
          # Auto Pitch only: self-contained High Tracking regression (no corpus needed).
          # Proves the poly engine still follows a corrected note's overtones above 2.5 kHz
          # into key — the +4.46 pt corpus win, locked so it can't silently regress.
          if [ "${{ matrix.render }}" = "AutoPitchRender" ]; then
            echo "Running $bin --hitracktest"
            "$bin" --hitracktest
          fi

  # ---------------------------------------------------------------------------
  # Root configure + complete non-StemDeck compilation. StemDeck has a separate
  # heavyweight gate and is intentionally outside this suite program.
  # ---------------------------------------------------------------------------
  suite-build:
    name: Build complete non-StemDeck suite
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        # Idempotent: the self-hosted Mac already has these, so only install if missing.
        run: command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure suite (all plugins together)
        run: cmake -S . -B build/all -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile every configured product
        run: cmake --build build/all -j"$(sysctl -n hw.ncpu)"

      - name: Cross-plugin session bus contract
        run: |
          cmake --build build/all --target SattariCrossPluginBusContract -j"$(sysctl -n hw.ncpu)"
          bin="$(find build/all -type f -name SattariCrossPluginBusContract -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::SattariCrossPluginBusContract not found"; exit 1; fi
          "$bin"

      - name: Complete contract and render-smoke profile
        run: ./scripts/verify_all.sh --smoke

      - name: Render Studio editor contracts
        run: ctest --test-dir build/all -L ui --output-on-failure
