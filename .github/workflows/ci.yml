name: Sattari Audio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast, dependency-light gates. No JUCE / no submodules, so this finishes in
  # seconds and gives quick feedback on structure + cross-language consistency.
  # ---------------------------------------------------------------------------
  checks:
    name: Checks (structure + brand sync + core contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Suite structure inventory
        run: python3 scripts/suite_gate_check.py

      - name: Source layout + truth-label gate
        run: ./scripts/validate_sources.sh

      - name: Brand registry <-> Hub manifest sync
        run: python3 scripts/check_brand_registry_sync.py

      - name: Build + run pure-C++ core contracts
        run: |
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/harmonic_core_contract.cpp -o /tmp/harmonic_core_contract
          /tmp/harmonic_core_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/key_detector_contract.cpp -o /tmp/key_detector_contract
          /tmp/key_detector_contract
          g++ -std=c++17 -Icore/include -Wall -Wextra \
            core/tests/chromagram_contract.cpp -o /tmp/chromagram_contract
          /tmp/chromagram_contract

  # ---------------------------------------------------------------------------
  # Per-plugin build matrix on macOS: proves each plugin still configures and
  # builds AU/VST3/Standalone, and runs the plugin's contract test where one
  # exists. fail-fast: false so one broken plugin doesn't mask the others.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.plugin }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: sub-conjurer }
          - { plugin: bus,               test: SattariBusCoreContract }
          - { plugin: side-chain-master, test: SideChainMasterCoreContract }
          - { plugin: align,             test: SattariAlignCoreContract }
          - { plugin: royal-chain,       test: RoyalChainColorAliasingContract }
          - { plugin: sattari-arp,       test: SattariArpTimingContract }
          - { plugin: voxkey,            test: VoxKeyCoreContract }
          - { plugin: auto-pitch,        test: AutoPitchCoreContract, render: AutoPitchRender, bench: AutoPitchBench }
          - { plugin: stemdeck,          test: StemDeckArchitectureContract }
          - { plugin: harmony,           test: HarmonyCoreContract, render: HarmonyRender }
          - { plugin: maqam,             test: MaqamCoreContract, render: MaqamRender }
          - { plugin: vocal-master,      test: VocalMasterCoreContract, render: VocalMasterRender }
          - { plugin: song-key,          render: SongKeyRender }
          - { plugin: rhythm-genie,      test: RhythmGenieCoreContract, render: RhythmGenieRender }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # JUCE lives in third_party/JUCE

      - name: Install build tools
        run: brew install ninja   # Rubber Band is vendored in third_party/; only Ninja is needed

      - name: Configure
        run: >
          cmake -S plugins/${{ matrix.plugin }}
          -B build/${{ matrix.plugin }}
          -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin (AU/VST3/Standalone)
        run: cmake --build build/${{ matrix.plugin }} --config Release -j3

      - name: Build + run contract test
        if: ${{ matrix.test != '' }}
        run: |
          cmake --build build/${{ matrix.plugin }} --target ${{ matrix.test }} -j3
          bin="$(find build/${{ matrix.plugin }} -type f -name '${{ matrix.test }}' -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::contract test binary ${{ matrix.test }} not found"; exit 1; fi
          echo "Running $bin"
          "$bin"

      # Render harness in --smoke mode: proves the real audio path produces
      # finite, non-silent output. A strict null-test against the golden runs
      # locally (same machine + Rubber Band); it is intentionally NOT a CI gate
      # because Rubber Band output is not bit-portable across versions/platforms.
      - name: Build + run render smoke
        if: ${{ matrix.render != '' }}
        run: |
          cmake --build build/${{ matrix.plugin }} --target ${{ matrix.render }} -j3
          bin="$(find build/${{ matrix.plugin }} -type f -name '${{ matrix.render }}' -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::render binary ${{ matrix.render }} not found"; exit 1; fi
          echo "Running $bin --smoke"
          "$bin" --smoke

      # Objective quality gate. This tool measured correction accuracy in cents, THD,
      # real-time factor and reported-vs-measured latency all along — and then returned 0
      # regardless, because its PASS/WARN/FAIL verdicts were a string formatter with no
      # side effect. Nothing invoked it either, so a regression in any measured dimension
      # was invisible to CI. --gate makes a FAIL a non-zero exit.
      #
      # WARN is not fatal, deliberately. Two are outstanding and both are real but not
      # blocking: Rubber Band under-reports its latency by ~241 samples (5.0 ms), and the
      # vibrato-preservation check wants ON > 1.5x OFF while correction adds wobble to the
      # measurement itself. Wiring the gate in red, or loosening thresholds to make it
      # green, are both ways of killing a gate on the day it is born.
      #
      # Baseline at the time of wiring: 17 PASS / 2 WARN / 0 FAIL.
      - name: Build + run objective benchmark (gated)
        if: ${{ matrix.bench != '' }}
        run: |
          set -o pipefail
          cmake --build build/${{ matrix.plugin }} --target ${{ matrix.bench }} -j3
          bin="$(find build/${{ matrix.plugin }} -type f -name '${{ matrix.bench }}' -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::benchmark binary ${{ matrix.bench }} not found"; exit 1; fi
          echo "Running $bin --gate"
          "$bin" --gate

  # ---------------------------------------------------------------------------
  # StemDeck DSP accuracy gates. These assert real numeric behaviour against
  # synthetic ground truth (known BPMs/keys/tempo ramps, analytic resampling
  # error), so a regression in the analysis or audio path fails the build rather
  # than silently degrading. Each binary exits non-zero on failure.
  # StemDeckNeuralSmoke is intentionally excluded: it needs the 353 MB htdemucs
  # model and a real WAV, neither of which belongs in CI.
  # ---------------------------------------------------------------------------
  stemdeck-dsp:
    name: StemDeck DSP accuracy (beat / key / automix / resampler)
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ninja ccache

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: stemdeck-ccache-${{ runner.os }}-${{ hashFiles('plugins/stemdeck/**/*.cpp', 'plugins/stemdeck/**/*.h', 'plugins/stemdeck/CMakeLists.txt', 'third_party/JUCE/CMakeLists.txt') }}
          restore-keys: |
            stemdeck-ccache-${{ runner.os }}-

      # The neural engines are behind SATTARI_USE_ONNX, which was OFF everywhere —
      # so CI had never COMPILED NeuralBeatEngine's implementation, let alone run
      # it. That is how a hard compile error sat in the beat-confidence path
      # unnoticed. Fetch the vendored runtime and build with neural ON here.
      - name: Fetch vendored ONNX Runtime
        run: scripts/fetch_onnxruntime.sh

      # models/ is gitignored (the beat model alone is 87 MB), so without an
      # archive the neural smoke test skips and CI proves only that the neural
      # code COMPILES — which is already more than it did before, but it does not
      # prove the model runs. Same secret-archive shape as the corpus.
      - name: Fetch neural models (optional)
        env:
          STEMDECK_MODEL_ARCHIVE_URL: ${{ secrets.STEMDECK_MODEL_ARCHIVE_URL }}
        run: |
          if [ -z "$STEMDECK_MODEL_ARCHIVE_URL" ]; then
            echo "::warning::STEMDECK_MODEL_ARCHIVE_URL not configured; neural inference is not exercised (compile-only)"
            exit 0
          fi
          mkdir -p models
          curl --fail --location --silent --show-error \
            "$STEMDECK_MODEL_ARCHIVE_URL" -o models/models.tar.gz
          tar -xzf models/models.tar.gz -C models
          beat="$(find models -name beat-model.onnx -print -quit)"
          if [ -n "$beat" ]; then
            echo "SATTARI_STEMDECK_BEAT_MODEL=$PWD/$beat" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S plugins/stemdeck -B build/stemdeck -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DSATTARI_USE_ONNX=ON
          -DSTEMDECK_PRODUCT_LTO=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build + run registered StemDeck contracts
        run: |
          cmake --build build/stemdeck --target StemDeckContractSuite -j3
          ctest --test-dir build/stemdeck --output-on-failure -L contract

      - name: Run capture → edit → retime → export vertical slice
        run: |
          cmake --build build/stemdeck --target StemDeckSessionDemo -j3
          bin="$(find build/stemdeck -type f -name StemDeckSessionDemo -perm +111 | head -n1)"
          test -n "$bin"
          "$bin" "$RUNNER_TEMP/stemdeck-vertical-slice"

      - name: Build real-corpus gate
        run: cmake --build build/stemdeck --target StemDeckCorpusGate -j3

      - name: Build and validate clean-machine product bundles
        run: |
          cmake --build build/stemdeck --target \
            SattariStemDeck_Standalone SattariStemDeck_AU SattariStemDeck_VST3 -j3
          release="build/stemdeck/SattariStemDeck_artefacts/Release"
          for bundle in \
            "$release/Standalone/Sattari StemDeck.app" \
            "$release/AU/Sattari StemDeck.component" \
            "$release/VST3/Sattari StemDeck.vst3"; do
            scripts/selfcontain_onnx.sh "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done
          scripts/validate_stemdeck_app_bundle.sh \
            "$release/Standalone/Sattari StemDeck.app"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$release/AU/Sattari StemDeck.component" \
            "$HOME/Library/Audio/Plug-Ins/Components/Sattari StemDeck.component"
          # NOT `auval ... | tee`: GitHub's default shell is `bash -e {0}` with no
          # pipefail, so the pipe discarded auval's exit status entirely. And
          # `test -n "$p" && test "$p" -le 330` cannot fail the step either — set -e is
          # documented not to fire on a non-final command in an && list, so an auval run
          # that died before printing the parameter line left $params empty and the step
          # passed GREEN. Verified: `bash -e -c 'p=""; test -n "$p" && test "$p" -le 330'`
          # exits 0. Redirect instead of piping, and assert the verdict explicitly.
          set -o pipefail
          auval -v aumu Sd01 Satr > build/stemdeck/auval.log 2>&1 || {
            echo "::error::auval exited non-zero"; tail -40 build/stemdeck/auval.log; exit 1; }
          grep -q 'AU VALIDATION SUCCEEDED' build/stemdeck/auval.log || {
            echo "::error::auval did not report AU VALIDATION SUCCEEDED"
            tail -40 build/stemdeck/auval.log; exit 1; }
          params="$(sed -n 's/.*# # # \([0-9][0-9]*\) Global Scope Parameters:.*/\1/p' build/stemdeck/auval.log | head -1)"
          if [ -z "$params" ]; then
            echo "::error::could not read the AU parameter count from auval output"; exit 1
          fi
          if [ "$params" -gt 330 ]; then
            echo "::error::AU parameter budget exceeded: $params (limit 330)"; exit 1
          fi
          echo "AU parameters: $params (limit 330)"
          mkdir -p build/stemdeck/validated
          ditto -c -k --sequesterRsrc --keepParent \
            "$release/Standalone/Sattari StemDeck.app" \
            build/stemdeck/validated/Sattari-StemDeck-app.zip
          shasum -a 256 build/stemdeck/validated/Sattari-StemDeck-app.zip \
            > build/stemdeck/validated/Sattari-StemDeck-app.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: StemDeck-clean-machine-bundle
          path: build/stemdeck/validated/*
          if-no-files-found: error

      # The corpus contains licensed/private full-length music and is therefore
      # supplied by repository infrastructure rather than committed. Once the
      # secret URL is configured this becomes a hard CI gate; until then CI says
      # explicitly that accuracy is not certified instead of substituting tones.
      - name: Run real full-length music corpus
        env:
          STEMDECK_CORPUS_ARCHIVE_URL: ${{ secrets.STEMDECK_CORPUS_ARCHIVE_URL }}
        run: |
          if [ -z "$STEMDECK_CORPUS_ARCHIVE_URL" ]; then
            echo "::warning::STEMDECK_CORPUS_ARCHIVE_URL is not configured; real-music accuracy remains uncertified"
            exit 0
          fi
          mkdir -p build/stemdeck/real-corpus
          curl --fail --location --silent --show-error \
            "$STEMDECK_CORPUS_ARCHIVE_URL" -o build/stemdeck/real-corpus/corpus.tar.gz
          tar -xzf build/stemdeck/real-corpus/corpus.tar.gz -C build/stemdeck/real-corpus
          manifest="$(find build/stemdeck/real-corpus -name corpus.json -print -quit)"
          test -n "$manifest"
          build/stemdeck/StemDeckCorpusGate "$manifest" build/stemdeck/real-corpus-report.json

  # ---------------------------------------------------------------------------
  # Root configure + cross-plugin contract. Configuring from the repo root
  # exercises every plugin's add_subdirectory together (catching cross-target /
  # shared-core breakage the matrix can miss); we then build only the
  # cross-plugin bus contract, NOT all 33 artifacts — the matrix already proves
  # each plugin builds, so a second full build just burned macOS minutes and
  # starved the matrix jobs.
  # ---------------------------------------------------------------------------
  suite-build:
    name: Root configure + cross-plugin contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ninja   # Rubber Band is vendored in third_party/; only Ninja is needed

      - name: Configure suite (all plugins together)
        run: cmake -S . -B build/all -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Cross-plugin session bus contract
        run: |
          cmake --build build/all --target SattariCrossPluginBusContract -j3
          bin="$(find build/all -type f -name SattariCrossPluginBusContract -perm +111 | head -n1)"
          if [ -z "$bin" ]; then echo "::error::SattariCrossPluginBusContract not found"; exit 1; fi
          "$bin"
