name: StemDeck signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.5.0

concurrency:
  group: stemdeck-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ninja

      - name: Import Developer ID certificates
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/stemdeck-signing.keychain-db"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$keychain"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$CERTIFICATE_PASSWORD" "$keychain"

      - name: Configure notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials stemdeck-ci \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build, test, sign, package, and notarize
        env:
          STEMDECK_RELEASE_VERSION: ${{ inputs.version }}
          SATTARI_DEV_APP_ID: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          SATTARI_DEV_INSTALLER_ID: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          SATTARI_NOTARY_PROFILE: stemdeck-ci
        run: scripts/release_stemdeck.sh build/releases

      - uses: actions/upload-artifact@v4
        with:
          name: Sattari-StemDeck-${{ inputs.version }}
          path: |
            build/releases/*.pkg
            build/releases/*.sha256
          if-no-files-found: error
