<!DOCTYPE html><html><head><meta charset="utf-8"><title>suite</title><style>
:root{
  --ink:      #1d1d1f;
  --ink-2:    #6e6e73;
  --ink-3:    #86868b;
  --bg:       #ffffff;
  --bg-2:     #f5f5f7;
  --line:     #d2d2d7;
  --line-2:   #e8e8ed;
  --accent:   #0071e3;
  --accent-h: #0077ed;
  --mint:     #00a37a;   /* the Sattari mark, darkened for contrast on white */
  --radius:   18px;
  --radius-l: 28px;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:#fff;color:var(--ink);padding:22px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
/* Six-product grid. The tile leads with the VERB, because what a product does
   for you is the thing worth scanning; the plugin count is reassurance, not
   the pitch. */
.suite-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.suite-card{position:relative;display:flex;flex-direction:column;background:#fff;
  border:1px solid var(--line-2);border-radius:var(--radius);padding:26px 26px 22px;
  transition:.2s;overflow:hidden}
.suite-card:hover{border-color:var(--ink-3);transform:translateY(-2px);text-decoration:none}
.suite-card::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--sc)}
.suite-card .sc-verb{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--sc);margin-bottom:9px}
.suite-card h3{font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin-bottom:9px}
.suite-card p{font-size:15px;line-height:1.6;color:var(--ink-2);flex:1;margin-bottom:16px}
.suite-card .sc-foot{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-3)}
.suite-card .sc-tier{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 9px;border-radius:980px;border:1px solid var(--line);
  color:var(--ink-2)}
.suite-card .sc-tier.free{border-color:var(--mint);color:var(--mint)}
@media(max-width:640px){.suite-card{padding:22px}}
</style></head><body><div class="suite-grid" id="suite-grid"></div>
<script src="product-catalog.js"></script><script>// Six products, rendered from the generated catalog so the page can never
// disagree with config/products.json about what ships.
(function () {
  var suite = window.SATTARI_SUITE || [];
  var host  = document.getElementById('suite-grid');
  if (!host || !suite.length) return;
  var HUE = { mint:'#00a37a', violet:'#7c5cff', amber:'#c77a1a', blue:'#0071e3', crimson:'#e8384f' };

  host.innerHTML = suite.map(function (s) {
    var n = s.count || 0;
    return '<a class="suite-card" href="#plugins" style="--sc:' + (HUE[s.accent] || HUE.mint) + '">' +
      '<div class="sc-verb">' + s.verb + '</div>' +
      '<h3>' + s.name.replace('Sattari ', '') + '</h3>' +
      '<p>' + s.tagline + '</p>' +
      '<div class="sc-foot">' +
        '<span class="sc-tier' + (s.tier === 'free' ? ' free' : '') + '">' + s.tier + '</span>' +
        '<span>' + n + ' plugin' + (n === 1 ? '' : 's') + '</span>' +
      '</div></a>';
  }).join('');
})();</script></body></html>
