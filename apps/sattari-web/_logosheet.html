<!DOCTYPE html><html><head><meta charset="utf-8"><title>marks</title>
<style>
:root{--mint:#00a37a;--ink:#1d1d1f;--ink-2:#6e6e73;--bg-2:#f5f5f7;--line-2:#e8e8ed}
body{margin:0;padding:14px;font:12px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:var(--ink)}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.c{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 3px;border:1px solid var(--line-2);border-radius:9px}
.b{width:38px;height:38px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.b svg{width:23px;height:23px}
.n{font-size:9.5px;color:var(--ink-2);text-align:center;line-height:1.2}
</style></head><body>
<div class="g" id="g"></div>
<script src="plugins-data.js"></script><script src="logos.js"></script><script>
document.getElementById('g').innerHTML = (window.SATTARI_PLUGINS||[]).map(function(p){
  return '<div class="c"><div class="b">'+SATTARI_LOGO(p.id)+'</div><div class="n">'+p.name.replace('Sattari ','')+'</div></div>';
}).join('');
</script></body></html>
