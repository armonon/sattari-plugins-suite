<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sattari Audio — Plugin</title>
<meta name="description" content="How it works and what it does — a Sattari Audio plugin." />
<style>
/* Light theme, shared vocabulary with index.html. System font stack so it
   renders as SF Pro on macOS/iOS. */
:root{
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --bg:#ffffff; --bg-2:#f5f5f7; --line:#d2d2d7; --line-2:#e8e8ed;
  --accent:#0071e3; --accent-h:#0077ed; --mint:#00a37a;
  --radius:18px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.47;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-2)}
.nav-in{max-width:860px;margin:0 auto;padding:0 22px;height:48px;
  display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand img{width:132px;height:auto;filter:invert(1)}
.nav-in .cta{font-size:12px;color:var(--accent)}

.wrap{max-width:860px;margin:0 auto;padding:56px 22px 96px}
.back{display:inline-block;font-size:14px;color:var(--ink-2);margin-bottom:34px}
.back:hover{color:var(--ink);text-decoration:none}

.head{display:flex;align-items:flex-start;gap:20px;margin-bottom:18px}
.icon{width:66px;height:66px;border-radius:16px;background:var(--bg-2);
  border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--ink)}
.icon svg{width:36px;height:36px;display:block}
.cat{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mint);margin-bottom:8px}
h1{font-size:clamp(32px,5.5vw,48px);font-weight:600;line-height:1.06;letter-spacing:-.03em}
.tagline{font-size:21px;color:var(--ink-2);line-height:1.5;margin:22px 0 24px;max-width:640px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:52px}
.tag{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:980px;
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink-2)}
.product-visual{margin:-18px 0 52px;border-radius:24px;background:#0b0c0d;padding:28px;
  border:1px solid #222529;overflow:hidden}
.product-visual img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 26px rgba(0,0,0,.46))}
.product-visual figcaption{text-align:center;margin-top:16px;font-family:var(--mono);
  font-size:10px;letter-spacing:.08em;color:#8d939a}
@media(max-width:640px){.product-visual{padding:14px;border-radius:18px}}

.section{margin-bottom:42px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px}
.card{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:30px 32px}
.card p{font-size:17px;line-height:1.72;color:var(--ink-2)}
.feature-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:13px 28px}
@media(max-width:640px){.feature-list{grid-template-columns:1fr}}
.feature-list li{display:flex;align-items:flex-start;gap:11px;font-size:15px;
  color:var(--ink-2);line-height:1.55}
.feature-list li::before{content:'';flex-shrink:0;width:5px;height:5px;border-radius:50%;
  background:var(--mint);margin-top:9px}

.cta-row{margin-top:52px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 24px;
  border-radius:980px;font-size:17px;transition:background .2s}
.btn:hover{background:var(--accent-h);text-decoration:none}
.btn-ghost{font-size:17px;color:var(--accent)}

.more{margin-top:72px;border-top:1px solid var(--line-2);padding-top:34px}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
  gap:10px;margin-top:18px}
.more-card{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;
  border:1px solid var(--line-2);border-radius:12px;font-size:14px;color:var(--ink);
  transition:.2s}
.more-card:hover{border-color:var(--ink-3);transform:translateY(-2px);text-decoration:none}
.more-card .mi{width:20px;height:20px;flex-shrink:0;display:block;color:var(--ink-2)}
.more-card:hover .mi{color:var(--ink)}

footer{border-top:1px solid var(--line-2);padding:40px 22px;text-align:center;
  color:var(--ink-3);font-size:12px;background:var(--bg-2)}
.footer-brand{display:flex;align-items:center;justify-content:center;gap:16px}
.footer-brand img{width:150px;height:auto;filter:invert(1)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html" aria-label="Sattari Audio home">
      <img src="assets/sattari-logo-white.png" alt="Sattari Musical Instruments USA" />
    </a>
    <a class="cta" href="index.html#status">Testing status&nbsp;›</a>
  </div>
</nav>

<main class="wrap" id="main">
  <a href="index.html#plugins" class="back">← All plugins</a>
  <div id="content"></div>
</main>

<footer>
  <div class="footer-brand">
    <img src="assets/sattari-logo-white.png" alt="Sattari Musical Instruments USA" />
    <span>© <span id="yr"></span></span>
  </div>
</footer>

<script src="product-catalog.js"></script>
<script src="plugins-data.js"></script>
<script src="logos.js"></script>
<script src="product-shots.js"></script>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();

(function () {
  var id  = new URLSearchParams(location.search).get('id');
  var lifecycle = {};
  (window.SATTARI_PRODUCT_CATALOG || []).forEach(function (x) { lifecycle[x.id] = x; });
  var suiteNames = {};
  (window.SATTARI_SUITE || []).forEach(function (x) {
    suiteNames[x.id] = x.name;
  });
  var all = (window.SATTARI_PLUGINS || []).filter(function (x) {
    return lifecycle[x.id] && lifecycle[x.id].webVisible;
  }).map(function (x) { return Object.assign({}, x, lifecycle[x.id]); });
  var p   = all.filter(function (x) { return x.id === id; })[0];
  var el  = document.getElementById('content');

  if (!p) {
    el.innerHTML = '<h1>Plugin not found</h1>' +
      '<p class="tagline">Head back to the <a href="index.html#plugins">plugin list</a>.</p>';
    return;
  }

  document.title = p.name + ' — Sattari Audio';

  var displayName = p.name.replace(/^Sattari\s+/, '');
  var tags  = ['Part of ' + (suiteNames[p.suite] || 'Sattari Audio')]
    .concat(p.formats || [])
    .map(function (f) { return '<span class="tag">' + f + '</span>'; }).join('');
  var feats = (p.features || []).map(function (f) { return '<li>' + f + '</li>'; }).join('');
  var shot = (window.SATTARI_PRODUCT_SHOTS || {})[p.id];
  var visual = shot
    ? '<figure class="product-visual"><img src="' + shot.src + '" alt="' + shot.alt +
      '" /><figcaption>REAL INTERFACE · CURRENT DEVELOPMENT BUILD</figcaption></figure>'
    : '';
  var others = all.filter(function (x) { return x.id !== p.id && x.suite === p.suite; })
    .map(function (x) {
      return '<a class="more-card" href="plugin.html?id=' + encodeURIComponent(x.id) + '">' +
             '<span class="mi">' + SATTARI_LOGO(x.id) + '</span>' +
             x.name.replace('Sattari ', '') + '</a>';
    }).join('');

  el.innerHTML =
    '<div class="head">' +
      '<div class="icon">' + SATTARI_LOGO(p.id) + '</div>' +
      '<div><div class="cat">' + (suiteNames[p.suite] || p.category || '') + ' · ' +
        (p.lifecycle || 'experimental') + '</div><h1>' + displayName + '</h1></div>' +
    '</div>' +
    '<p class="tagline">' + (p.tagline || '') + '</p>' +
    '<div class="tags">' + tags + '</div>' +
    visual +

    '<div class="section"><div class="label">What it does</div>' +
      '<div class="card"><p>' + (p.what || '') + '</p></div></div>' +

    '<div class="section"><div class="label">How it works</div>' +
      '<div class="card"><p>' + (p.how || '') + '</p></div></div>' +

    (feats ? '<div class="section"><div class="label">Key features</div>' +
      '<ul class="feature-list">' + feats + '</ul></div>' : '') +

    '<div class="cta-row">' +
      '<a class="btn" href="index.html#status">View testing status</a>' +
      '<a class="btn-ghost" href="index.html#plugins">Browse all plugins&nbsp;›</a>' +
    '</div>' +

    '<div class="more"><div class="label">More in ' + (suiteNames[p.suite] || 'the suite') + '</div>' +
      '<div class="more-grid">' + others + '</div></div>';
})();
</script>
</body>
</html>
